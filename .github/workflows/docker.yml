name: Docker

# Builds the image (BACKLOG P35) and smoke-tests it: the web server answers /health as a
# non-root user, and portfolio-sync starts. Only when something that goes into the image
# changes, since a release build takes several minutes. linux/amd64 only: GitHub's hosted
# runners are x86, and an emulated arm64 Rust build would take far longer; arm64 is built
# natively on the Mac (README, "Docker").

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - migrations/**
      - design/tokens.css
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - migrations/**
      - design/tokens.css

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build + smoke test (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          # `portfolio` is the tag compose.yaml uses, so the compose test runs this build.
          tags: |
            portfolio:ci
            portfolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image holds no secrets, data or config
        run: |
          set -eu
          # /data and /config are only mount points; no .env may be anywhere.
          out=$(docker run --rm --entrypoint /bin/sh portfolio:ci -c \
            'find /data /config -mindepth 1; find / -xdev -name ".env" 2>/dev/null; true')
          if [ -n "$out" ]; then echo "unexpected files in the image:"; echo "$out"; exit 1; fi

      - name: Runs as non-root in Europe/Warsaw
        run: |
          set -eu
          test "$(docker run --rm --entrypoint id portfolio:ci -u)" = 10001
          test "$(docker run --rm --entrypoint date portfolio:ci +%Z | tr -d '\n')" != UTC

      - name: portfolio-web answers /health
        run: |
          set -eu
          docker run -d --name web -p 127.0.0.1:3000:3000 \
            -v "$PWD/config.toml:/config/config.toml:ro" portfolio:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; docker rm -f web; exit 0; fi
            sleep 1
          done
          docker logs web
          exit 1

      - name: portfolio-sync starts
        run: docker run --rm portfolio:ci portfolio-sync --help

      - name: supercronic and the crontab
        run: docker run --rm portfolio:ci supercronic -test /etc/portfolio/crontab

      - name: compose.yaml starts web healthy and the sync scheduler
        run: |
          set -eu
          # Keys are not needed to start; an empty .env stands in for the real one.
          touch .env
          docker compose config --quiet
          trap 'docker compose logs; docker compose down -v' EXIT
          docker compose up -d --no-build --wait --wait-timeout 60
          web=$(docker compose ps -q web)
          sync=$(docker compose ps -q sync)
          test "$(docker inspect -f '{{.State.Health.Status}}' "$web")" = healthy
          curl -fsS http://127.0.0.1:3000/health; echo
          # Published on loopback only.
          test "$(docker compose port web 3000)" = 127.0.0.1:3000
          # sync with no arguments is supercronic waiting for 22:30, not a one-off run.
          top=$(docker compose top sync)
          echo "$top"
          case "$top" in *"supercronic /etc/portfolio/crontab"*) ;; *) exit 1 ;; esac
          # Arguments go to portfolio-sync once.
          help=$(docker compose run --rm sync --help)
          case "$help" in *"usage: portfolio-sync"*) ;; *) echo "$help"; exit 1 ;; esac
          # Hardening: read-only root, no capabilities, no new privileges; /data and /tmp writable.
          if docker compose exec -T web sh -c 'touch /usr/local/bin/x' 2>/dev/null; then
            echo "root filesystem is writable"; exit 1
          fi
          docker compose exec -T web sh -c 'touch /data/.w /tmp/.w && rm /data/.w /tmp/.w'
          for id in "$web" "$sync"; do
            test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$id")" = true
            test "$(docker inspect -f '{{.HostConfig.CapDrop}}' "$id")" = "[ALL]"
            case "$(docker inspect -f '{{.HostConfig.SecurityOpt}}' "$id")" in
              *no-new-privileges*) ;; *) exit 1 ;;
            esac
          done
          # Memory, CPU and PIDs at idle, for the limits in compose.yaml.
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}\t{{.PIDs}}'
