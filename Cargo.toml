[workspace]
resolver = "3"
members = ["crates/core", "crates/web", "crates/sync", "crates/db", "crates/sources"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
portfolio-core = { path = "crates/core" }
portfolio-db = { path = "crates/db" }
portfolio-sources = { path = "crates/sources" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rust_decimal = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# arbitrary_precision keeps JSON numbers as their original text, so rates never pass through f64.
serde_json = { version = "1", features = ["arbitrary_precision"] }
wiremock = "0.6"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
