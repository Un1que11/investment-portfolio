{% if let Some(series) = data %}
<div id="chart-data" data-series="{{ series }}"></div>
{% if gaps > 0 %}<p class="notes">{{ gaps }} day(s) have no complete value and are left as gaps in the line.</p>{% endif %}
{% else %}
<p class="muted">Nothing to draw yet.</p>
{% endif %}
{% if !problems.is_empty() %}
<ul class="notes">
  {% for p in problems %}<li>{{ p }}</li>{% endfor %}
</ul>
{% endif %}
