# The dashboard and the daily sync in containers (BACKLOG P36), from the image in Dockerfile.
#
#   docker compose up -d --build                      # build, then start both services
#   docker compose run --rm sync --date 2026-10-20    # catch up one day
#   docker compose run --rm sync summary              # print last month's summary
#   docker compose down                               # stop; the database volume stays
#
# Needs .env (keys, see .env.example) and config.toml next to this file. The database lives on
# the named volume `portfolio-data`, the same one the plain `docker run` commands in the README
# use. Run either this or the launchd agents, never both: two daily syncs would each fetch and
# write the same day.

name: portfolio

# Shared by both services: one image, keys from .env, config read-only, a read-only root
# filesystem, no capabilities and capped logs.
x-service: &service
  image: portfolio
  build: .
  env_file: .env
  environment:
    # Set here, so a .env written for the launchd setup cannot point the container elsewhere.
    TZ: Europe/Warsaw
    PORTFOLIO_DB_URL: sqlite:///data/portfolio.db
    PORTFOLIO_CONFIG: /config/config.toml
    # All interfaces inside the container, so the published port reaches web; the host side is
    # published on loopback only (sync does not read it).
    PORTFOLIO_ADDR: 0.0.0.0:3000
  volumes:
    - portfolio-data:/data
    - ./config.toml:/config/config.toml:ro
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  web:
    <<: *service
    command: ["portfolio-web"]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # The image has no curl: the binary asks its own /health (`portfolio-web healthcheck`).
      test: ["CMD", "portfolio-web", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 1.0
    pids_limit: 128
    # The pages fetch prices (NBP, Kraken, Alpha Vantage) when they are opened, and a port can
    # only be published from a network with outside access, so web is on both.
    networks: [internal, egress]

  sync:
    <<: *service
    # No arguments: supercronic runs portfolio-sync daily at 22:30 Europe/Warsaw (the crontab
    # is in the image). With arguments, as in `docker compose run --rm sync --date …`, they go to
    # portfolio-sync once. tini stays PID 1; `$$` is a literal `$` for compose.
    entrypoint:
      - /usr/bin/tini
      - --
      - /bin/sh
      - -c
      - 'if [ "$$#" -eq 0 ]; then exec supercronic /etc/portfolio/crontab; else exec portfolio-sync "$$@"; fi'
      - portfolio-sync
    command: []
    restart: unless-stopped
    # supercronic waits for a running sync on SIGTERM; give it time to finish its write.
    stop_grace_period: 60s
    mem_limit: 256m
    mem_reservation: 32m
    cpus: 0.5
    pids_limit: 64
    # NBP, Kraken, Alpha Vantage and Telegram; nothing talks to web.
    networks: [egress]

volumes:
  portfolio-data:
    name: portfolio-data

networks:
  # No route outside. web is attached so that anything added later that only needs to reach
  # the dashboard can sit here without outside access.
  internal:
    internal: true
  egress: {}
